# Publica la v3 cada vez que algo de v3/ entra en main (el usuario, 2026-11-06: «la idea es que siempre
# se pueda hacer deploy desde el propio chat […] que sea deploy automático es lo más cómodo»).
# Fusionar una PR es publicar: comprobaciones, migraciones en la nube, datos comunes, build y Cloudflare.
# Las claves son secretos del repositorio (Settings → Secrets and variables → Actions), nunca van a Git.
# Lo que no hace: el sync-config.yaml de PowerSync Cloud (se despliega en su panel; si cambia, avisa)
# ni las tandas de tu cuenta (cargar-laboratorio.ts, con tu correo).
name: Publicar v3

on:
  push:
    branches: [main]
    paths: ["v3/**", ".github/workflows/publicar-v3.yml"]
  workflow_dispatch:

# Una publicación detrás de otra, nunca dos a la vez contra la misma base.
concurrency:
  group: publicar-v3
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    env:
      DATABASE_URL_CLOUD: ${{ secrets.DATABASE_URL_CLOUD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Faltan secretos
        run: |
          missing=""
          for name in DATABASE_URL_CLOUD VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_POWERSYNC_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing. No se publica nada."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - run: npm ci

      # Nada se publica si algo falla antes de tocar la nube.
      - name: Comprobaciones (tsc, pruebas, build)
        run: |
          npx tsc -b
          npm test
          npm run build

      - name: Migraciones en la nube
        # config.toml points at the local stack's signing key (ignored by Git). The push does not use
        # it, but the CLI reads it when it loads the config: an empty list is enough, with no key in it.
        run: |
          test -f supabase/signing_key.json || echo '[]' > supabase/signing_key.json
          npx supabase db push --yes --db-url "$DATABASE_URL_CLOUD"

      - name: Datos comunes en la nube
        run: npm run datos:cargar:nube

      - name: Publicar en Cloudflare
        run: npx --yes wrangler@4 deploy

      - name: PowerSync
        working-directory: .
        run: |
          if git diff --name-only HEAD~1 HEAD -- v3/powersync/sync-config.yaml | grep -q .; then
            echo "::warning::sync-config.yaml ha cambiado: hay que desplegarlo a mano en el panel de PowerSync Cloud (instancia Perfurepo, Sync Rules)."
          fi
