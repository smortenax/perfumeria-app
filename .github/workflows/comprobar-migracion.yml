# Las reglas duras de la migración (V3-111) en cada PR que toca migracion-v3/: ver migracion-v3/LEEME.md.
name: Comprobar migración

on:
  pull_request:
    paths: ["migracion-v3/**", ".github/workflows/comprobar-migracion.yml"]
  workflow_dispatch:

concurrency:
  group: comprobar-migracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reglas duras de la migración
        run: npx vitest run --config migracion-v3/vitest.config.ts
